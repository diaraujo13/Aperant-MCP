[package]
name = "auto-claude-tauri"
version = "0.2.0-beta.0"
edition = "2021"
description = "Tauri 2 shell for Aperant-MCP / Auto-Claude (migration from Electron)"
license = "AGPL-3.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["sync", "macros", "rt", "process", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
semver = "1.0"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
notify = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["sync", "macros", "rt", "test-util"] }
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
